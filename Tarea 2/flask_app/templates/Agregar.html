{% extends "base.html" %}
{% block title %}Agregar aviso{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/Estilos.css') }}">
{% endblock %}

{% block content %}
<h1>Agregar Aviso</h1>

<form id="form-agregar" action="{{ url_for('agregar') }}" method="POST" enctype="multipart/form-data" onsubmit="return validateForm();">

  <div class="form-group">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>
  </div>

  <div class="form-group">
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required>
  </div>

  <div class="form-group">
    <label for="celular">Celular (formato +56...):</label>
    <input type="text" id="celular" name="celular">
  </div>

  <div class="form-group">
    <label for="tipo">Tipo de mascota:</label>
    <select id="tipo" name="tipo" required>
      <option value="">Seleccione tipo</option>
      <option value="perro">Perro</option>
      <option value="gato">Gato</option>
    </select>
  </div>

  <div class="form-group">
    <label for="select-region">Región:</label>
    <select name="region" id="select-region" required>
      <option value="" disabled selected>Seleccione su región</option>
      {% for region in regiones %}
        <option value="{{ region[0] }}">{{ region[1] }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label for="select-comuna">Comuna:</label>
    <select name="comuna" id="select-comuna" required disabled>
      {% for comuna in comunas %}
        <option value="" disabled selected>Primero seleccione una región</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label for="sector">Sector:</label>
    <input type="text" id="sector" name="sector">
  </div>

  <div class="form-group">
    <label for="cantidad">Cantidad:</label>
    <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
  </div>

  <div class="form-group">
    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" min="0" required>
  </div>

  <div class="form-group">
    <label for="unidad">Unidad:</label>
    <select id="unidad" name="unidad" required>
      <option value="">Seleccione unidad</option>
      <option value="m">Meses</option>
      <option value="a">Años</option>
    </select>
  </div>

  <div class="form-group">
    <label for="descripcion">Descripción:</label>
    <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
  </div>

  <div class="form-group">
    <label for="fecha">Fecha de entrega:</label>
    <input type="datetime-local" id="fecha" name="fecha" required>
  </div>

  <div class="form-group">
    <label>Fotos:</label>
    <div id="photo-inputs">
      <input type="file" name="fotos" accept="image/*" class="foto-input">
    </div>
    <button type="button" id="add-photo-btn">Agregar otra foto</button>
  </div>

  <button type="submit" id="submit-btn">Publicar aviso</button>
</form>

<p><a href="{{ url_for('portada') }}">Volver a la portada</a></p>

<div id="fotoGrande" style="display:none;">
  <img id="imgAmpliada" src="" alt="Imagen grande">
  <button onclick="cerrarGrande()">Cerrar</button>
</div>

{% endblock %}

{% block javascript %}
  <script src="{{ url_for('static', filename='js/funciones.js') }}"></script>
  <script src="{{ url_for('static', filename='js/validaciones.js') }}"></script>
{% endblock %}
