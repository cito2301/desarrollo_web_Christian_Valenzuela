<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Aviso</title>
  <link rel="stylesheet" href="./Estilos.css">
</head>
<body>
  <div class="main-container">
    <h1>Agregar Aviso de Adopción</h1>

    <div id="val-box" hidden>
      <h2 id="val-msg"></h2>
      <ul id="val-list"></ul>
    </div>

    <form name="myForm" id="myForm" enctype="multipart/form-data">
      <fieldset>
        <legend>¿Donde?</legend>
        <label for="region">Región</label>
        <select id="region" name="region">
            <option value="">Seleccione región</option>
        </select><br>
      
        <label for="comuna">Comuna</label>
        <select id="comuna" name="comuna">
            <option value="">Seleccione comuna</option>
        </select><br>

        <label for="sector">Sector</label>
        <input type="text" id="sector" name="sector" maxlength="100"><br>
      </fieldset>  
      
      <fieldset>
        <legend>¿Contacto de esta publicación?:</legend>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre"><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"><br>

        <label for="celular">Celular</label>
        <input type="tel" id="celular" name="celular" placeholder="+569.12345678"><br>

        <label for="red">Contactar por</label>
        <select id="red" name="red">
            <option value="">Seleccione</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Instagram">Instagram</option>
            <option value="Telegram">Telegram</option>
            <option value="X">X</option>
            <option value="TikTok">TikTok</option>
            <option value="Otra">Otra</option>

        </select>
        <button type="button" onclick="agregarContacto()">Agregar</button>
        <div id="contactos"></div>
        </fieldset>
      

      <fieldset>
        <legend>¿Qué mascota ofrece en adopción?:</legend>
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo">
            <option value="">Seleccione</option>
            <option value="gato">Gato</option>
            <option value="perro">Perro</option>
        </select><br>

        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" name="cantidad" min="1"><br>

        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="1">
        <select id="unidad" name="unidad">
            <option value="">Seleccione</option>
            <option value="meses">Meses</option>
            <option value="años">Años</option>
        </select><br>

        <label for="fecha">Fecha disponible de entrega</label>
        <input type="datetime-local" name="fecha" id="fecha"><br>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="10" cols="50"></textarea><br>

        <label for="Fotos">Fotos</label>
        <div id="photo-inputs">
          <input type="file" name="fotos" accept="image/*" class="foto-input"><br>
        </div>
        <button type="button" id="add-photo-btn">Agregar otra foto</button><br>
        <button id="submit-btn" type="button">Agregar aviso</button></fieldset>
    </form>

    <br><a href="Portada.html">Volver a portada</a>
  </div>

  <script src="./js/funciones.js"></script>
  <script src="./js/validaciones.js"></script>
</body>
</html>
